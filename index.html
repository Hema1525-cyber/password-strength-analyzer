<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Analyzer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Password Strength Analyzer</h1>
  <p class="sub">Checks a password on your device only. Nothing is sent or stored anywhere.</p>

  <div class="box">
    <div class="field">
      <input id="pw" type="password" placeholder="Type a password" autocomplete="off" aria-label="Password">
      <button id="toggle" type="button">Show</button>
    </div>
    <div class="bar"><div id="fill" class="fill"></div></div>
    <div class="row"><span id="label">Enter a password</span><span id="crack"></span></div>
  </div>

  <div class="box">
    <h2>Checks</h2>
    <ul id="checks"></ul>
  </div>

  <div class="box">
    <h2>Generate a strong password</h2>
    <div class="gen">
      <button id="gen" type="button" style="padding:10px 14px">Generate</button>
      <code id="out">-</code>
    </div>
    <p class="tip">Uses the browser's secure random generator (crypto.getRandomValues).</p>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
